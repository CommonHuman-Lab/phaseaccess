[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "phaseaccess"
version = "0.1.2"
description = "Native IDOR and broken object-level authorization detection engine"
readme = "README.md"
license = { text = "AGPL-3.0-or-later" }
requires-python = ">=3.10"
authors = [
  { name = "CommonHuman-Lab" },
]
keywords = ["idor", "bola", "security", "scanner", "pentest", "bugbounty", "api"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Information Technology",
  "License :: OSI Approved :: GNU Affero General Public License v3",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Security",
]
dependencies = [
  "requests>=2.28.0",
  "commonhuman-cli",
  "commonhuman-core",
]

[project.optional-dependencies]
gloomproxy = ["gloomproxy-sdk>=0.1.0"]
dev = ["pytest>=7", "pytest-cov", "pytest-mock>=3.0"]

[project.scripts]
phaseaccess = "phaseaccess.__main__:main"

[project.entry-points."gloomproxy.scanners"]
phaseaccess = "phaseaccess.integrations.gloomproxy.plugin:PhaseAccessPlugin"

[project.urls]
Homepage = "https://github.com/commonhuman-lab/phaseaccess"
Issues   = "https://github.com/commonhuman-lab/phaseaccess/issues"

[tool.hatch.build.targets.wheel]
packages = ["phaseaccess"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.coverage.run]
source = ["phaseaccess"]
omit = ["phaseaccess/__main__.py"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "phaseaccess"
version = "0.1.0"
description = "Native IDOR and broken object-level authorization detection engine"
readme = "README.md"
license = { text = "AGPL3" }
requires-python = ">=3.10"
authors = [
  { name = "CommonHuman-Lab" },
]
keywords = ["idor", "bola", "security", "scanner", "pentest", "bugbounty", "api"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Information Technology",
  "License :: OSI Approved :: AGPL3 License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Security",
]
dependencies = []

[project.scripts]
phaseaccess = "phaseaccess.__main__:main"

[project.urls]
Homepage = "https://github.com/commonhuman-lab/phaseaccess"
Issues   = "https://github.com/commonhuman-lab/phaseaccess/issues"

[tool.hatch.build.targets.wheel]
packages = ["phaseaccess"]
